name: Build Frame Window Counter

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Build Android
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          target: Android64
          path: .

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: FrameWindowCounter
          path: build/**/*.geode
          if-no-files-found: error
